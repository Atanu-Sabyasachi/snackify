name: snackify
description: Snackify is a Flutter package for displaying feature-rich snackbars with various types, titles, messages, and optional actions. It supports custom gradients, positioning, persistence, and text-to-speech features, offering an enhanced notification experience.
version: 1.2.0
license: MIT
homepage: https://github.com/Atanu-Sabyasachi/snackify/tree/master
repository: https://github.com/Atanu-Sabyasachi/snackify/tree/master

environment:
  sdk: ^3.5.0
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts:
  flutter_tts:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/images/
    - assets/snack_images/
